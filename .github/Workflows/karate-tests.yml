name: Karate API Tests

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  karate-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Karate Tests
        run: mvn clean test

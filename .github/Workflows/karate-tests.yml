name: Karate API Tests

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  karate-tests:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. Install Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 4. Install Prism
      - name: Install Prism
        run: npm install -g @stoplight/prism-cli

      # 5. Start Prism Mock Server
      - name: Start Prism
        run: |
          prism mock University.yml -p 4010 > prism.log 2>&1 &
          sleep 10

      # 6. Run Karate tests
      - name: Run Karate Tests
        run: mvn clean test